<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión</title>

<link rel="stylesheet" href="/css/iniciarsesion.css">
<link rel="stylesheet" href="/css/index.css">

</head> 
<body> 
    <div class="page">
 <header>
        <img src="../imagenes/logo.png" alt="Logo de la página" id="logo">
        
        <nav>
            <ul>
                <li>
                    <a href="/modules/registro.html" class="btn btn-primary">Registrarse</a>
                </li>
            </ul>
        </nav>
    </header>


<main class="main">

    <section class="signup-card">

        <div class="brand-header">

            <h1>Iniciar sesión</h1>

            <p>
                Bienvenido de nuevo
            </p>

        </div>

        <form class="form" id="loginForm">
            <div class="field">

                <label for="email">
                    Correo electrónico
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        ✉
                    </span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        required
                    >

                </div>

            </div>
            <div class="field">

                <label for="password">
                    Contraseña
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Tu contraseña"
                        required
                    >

                    <button
                        type="button"
                        class="eye-button"
                        onclick="mostrarPassword()"
                    >
                        👁
                    </button>

                </div>

            </div>
            <p class="terms">
                Al iniciar sesión aceptas nuestros
                <a href="#">
                    Términos y condiciones
                </a>
                y
                <a href="#">
                    Política de privacidad
                </a>.
            </p>
            <button
                type="submit"
                class="submit-button"
            >
                Iniciar sesión
            </button>

        </form>
        <div class="separator">

            <span></span>

            <p>
                O CONTINÚA CON
            </p>

            <span></span>

        </div>
        <div class="social-group">

            <button
                type="button"
                class="social-button"
            >
                <strong></strong>
                Google
            </button>

            <button
                type="button"
                class="social-button"
            >
                <strong></strong>
                Apple
            </button>

        </div>
        <div class="footer-group">

            <span>
                ¿No tienes una cuenta?
            </span>

            <a href="registro.html">
                Regístrate
            </a>

        </div>

    </section>

</main>

<footer class="footer">

    © 2026 PawSpa Voluntarios.
    Creado con amor para los animales sin hogar.
</footer>
    </div>
    <script src="/js/general.js"></script>
    <script src="/js/iniciarsesion.js"></script>
</body>
</html>
